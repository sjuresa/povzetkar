name: Java CI with Maven

on:
  push:
    branches: [ "v*.*", "main" ]
  pull_request:
    branches: [ "v*.*", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres_test_db:
        image: postgres:17.6
        env:
          POSTGRES_DB: ${{ secrets.TEST_DB_NAME }}
          POSTGRES_USER: ${{ secrets.TEST_DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASS }}
        ports:
          - 5433:5432 # Map container port 5432 to host port 5433
        options: >- # Health check to ensure DB is ready
          --health-cmd "pg_isready -U ${{ secrets.TEST_DB_USER }} -d ${{ secrets.TEST_DB_NAME }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Make mvnw executable
        run: chmod +x mvnw
      - name: Build and test with Maven
        run: ./mvnw verify
        env:
          TEST_DB_KIND: postgresql
          TEST_JDBC_URL: jdbc:postgresql://localhost:5433/${{ secrets.TEST_DB_NAME }}
          TEST_DB_USER: ${{ secrets.TEST_DB_USER }}
          TEST_DB_PASS: ${{ secrets.TEST_DB_PASS }}
