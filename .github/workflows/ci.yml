name: Full Stack CI

on:
  push:
    branches: [ "v*.*", "main" ]
  pull_request:
    branches: [ "v*.*", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    services:
      postgres_test_db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ${{ secrets.TEST_DB_NAME }}
          POSTGRES_USER: ${{ secrets.TEST_DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASS }}
        ports:
          - 5433:5432

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Planning & Traceability Audit
      run: python scripts/validate-planning.py --current-version v0.15.0 --fail-on all
      continue-on-error: true

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Set up Node.js 25.8
      uses: actions/setup-node@v4
      with:
        node-version: '25.8'
        cache: 'npm'

    - name: Install dependencies (root + frontend)
      run: npm install && cd frontend && npm install


    - name: Make mvnw executable
      run: chmod +x mvnw

    - name: Install PostgreSQL client
      run: sudo apt-get update && sudo apt-get -y install postgresql-client

    - name: Wait for PostgreSQL
      env:
        PGHOST: localhost
        PGPORT: 5433
        PGUSER: ${{ secrets.TEST_DB_USER }}
        PGPASSWORD: ${{ secrets.TEST_DB_PASS }}
        PGDATABASE: ${{ secrets.TEST_DB_NAME }}
      run: |
        until pg_isready -q; do
          echo "Waiting for database connection..."
          sleep 2
        done

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
      working-directory: ./frontend

    - name: Full Stack Test (Backend + Frontend Unit)
      run: npm run test
      env:
        TEST_DB_KIND: ${{ secrets.TEST_DB_KIND }}
        TEST_JDBC_URL: jdbc:postgresql://localhost:5433/${{ secrets.TEST_DB_NAME }}
        TEST_DB_USER: ${{ secrets.TEST_DB_USER }}
        TEST_DB_PASS: ${{ secrets.TEST_DB_PASS }}

    - name: E2E Tests (Playwright)
      run: npm run test:e2e
      env:
        # Playwright webServer needs these to start backend during E2E if configured
        TEST_DB_KIND: ${{ secrets.TEST_DB_KIND }}
        TEST_JDBC_URL: jdbc:postgresql://localhost:5433/${{ secrets.TEST_DB_NAME }}
        TEST_DB_USER: ${{ secrets.TEST_DB_USER }}
        TEST_DB_PASS: ${{ secrets.TEST_DB_PASS }}

    - name: Backend Quality Audit (SpotBugs + Verify)
      run: ./mvnw verify -pl backend -am
      env:
        TEST_DB_KIND: ${{ secrets.TEST_DB_KIND }}
        TEST_JDBC_URL: jdbc:postgresql://localhost:5433/${{ secrets.TEST_DB_NAME }}
        TEST_DB_USER: ${{ secrets.TEST_DB_USER }}
        TEST_DB_PASS: ${{ secrets.TEST_DB_PASS }}

    - name: Run Trivy vulnerability scanner (FS)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'table'
        exit-code: '1'
        severity: 'CRITICAL,HIGH'

    - name: Build Docker Image
      run: docker build -t povzetkar:${{ github.sha }} .

    - name: Run Trivy vulnerability scanner (Image)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'povzetkar:${{ github.sha }}'
        format: 'table'
        exit-code: '1'
        severity: 'CRITICAL,HIGH'
