name: Java CI with Maven

on:
  push:
    branches: [ "v*.*", "main" ]
  pull_request:
    branches: [ "v*.*", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Make mvnw executable
      run: chmod +x mvnw
    - name: Build and test with Maven
      run: ./mvnw verify