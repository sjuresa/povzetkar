name: Full Stack CI

on:
  push:
    branches: [ "v*.*", "main" ]
  pull_request:
    branches: [ "v*.*", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    services:
      postgres_test_db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: ${{ secrets.TEST_DB_NAME }}
          POSTGRES_USER: ${{ secrets.TEST_DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASS }}
        ports:
          - 5433:5432

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Planning & Traceability Audit
      run: |
        VERSION="v$(jq -r .version package.json | sed 's/-SNAPSHOT$//')"
        echo "Planning audit against $VERSION"
        python scripts/qa/validate-planning.py --current-version "$VERSION" --fail-on all

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Set up Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install dependencies (root + frontend)
      run: npm ci && cd frontend && npm ci


    - name: Make mvnw executable
      run: chmod +x mvnw

    # Runs before the tests: the spec must come from a build without test classes (test-only endpoints).
    - name: API client drift check
      run: |
        ./mvnw -q package -DskipTests -pl backend -am
        npm run gen:api --prefix frontend
        DRIFT="$(git status --porcelain -- frontend/src/api/generated)"
        if [ -n "$DRIFT" ]; then
          echo "$DRIFT"
          echo "::error::frontend/src/api/generated is out of date. Run './mvnw package -DskipTests -pl backend -am' and 'npm run gen:api', then commit the result."
          exit 1
        fi

    - name: Install PostgreSQL client
      run: sudo apt-get update && sudo apt-get -y install postgresql-client

    - name: Wait for PostgreSQL
      env:
        PGHOST: localhost
        PGPORT: 5433
        PGUSER: ${{ secrets.TEST_DB_USER }}
        PGPASSWORD: ${{ secrets.TEST_DB_PASS }}
        PGDATABASE: ${{ secrets.TEST_DB_NAME }}
      run: |
        until pg_isready -q; do
          echo "Waiting for database connection..."
          sleep 2
        done

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
      working-directory: ./frontend

    - name: Full Stack Test (Backend + Frontend Unit)
      run: npm run test
      env:
        TEST_DB_KIND: ${{ secrets.TEST_DB_KIND }}
        TEST_JDBC_URL: jdbc:postgresql://localhost:5433/${{ secrets.TEST_DB_NAME }}
        TEST_DB_USER: ${{ secrets.TEST_DB_USER }}
        TEST_DB_PASS: ${{ secrets.TEST_DB_PASS }}

    - name: E2E Tests (Playwright)
      run: npm run test:e2e
      env:
        # Playwright webServer needs these to start backend during E2E if configured
        TEST_DB_KIND: ${{ secrets.TEST_DB_KIND }}
        TEST_JDBC_URL: jdbc:postgresql://localhost:5433/${{ secrets.TEST_DB_NAME }}
        TEST_DB_USER: ${{ secrets.TEST_DB_USER }}
        TEST_DB_PASS: ${{ secrets.TEST_DB_PASS }}

    - name: Backend Quality Audit (SpotBugs + Verify)
      run: ./mvnw verify -pl backend -am
      env:
        TEST_DB_KIND: ${{ secrets.TEST_DB_KIND }}
        TEST_JDBC_URL: jdbc:postgresql://localhost:5433/${{ secrets.TEST_DB_NAME }}
        TEST_DB_USER: ${{ secrets.TEST_DB_USER }}
        TEST_DB_PASS: ${{ secrets.TEST_DB_PASS }}

    - name: Run Trivy vulnerability scanner (FS)
      # Pinned by commit SHA (tags were force-pushed in the March 2026 compromise, GHSA-69fq-xp46-6x23); bump deliberately, see checklist 3.1a
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        version: 'v0.74.0'
        scan-type: 'fs'
        scan-ref: '.'
        format: 'table'
        exit-code: '1'
        severity: 'CRITICAL,HIGH'
        trivyignores: '.trivyignore'

    - name: Validate infra configs (Prometheus, compose)
      run: bash scripts/qa/validate-infra-configs.sh

    - name: Build Docker Image
      run: docker build -t povzetkar:${{ github.sha }} .

    - name: Run Trivy vulnerability scanner (Image)
      # Pinned by commit SHA (tags were force-pushed in the March 2026 compromise, GHSA-69fq-xp46-6x23); bump deliberately, see checklist 3.1a
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        version: 'v0.74.0'
        image-ref: 'povzetkar:${{ github.sha }}'
        format: 'table'
        exit-code: '1'
        severity: 'CRITICAL,HIGH'
        trivyignores: '.trivyignore'
