<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Povzetkar summarizes new videos from the YouTube channels you follow into one short daily briefing. Early access." />
    <meta name="keywords" content="AI, summarizer, daily briefing, YouTube, transcript" />
    <meta property="og:title" content="Povzetkar | Daily briefings from your YouTube channels" />
    <meta property="og:description" content="Povzetkar summarizes new videos from the YouTube channels you follow into one short daily briefing. Early access." />
    <meta property="og:type" content="website" />
    <title>Povzetkar | Daily briefings from your YouTube channels</title>
    <script>
      // Pre-paint: apply theme and language before React loads, so a light-theme visitor sees no dark flash.
      // Same rules as resolveInitialTheme (src/store/themeStore.ts) and resolveInitialLanguage (src/i18n/language.ts).
      // A future Content-Security-Policy must allow this script by its sha256 hash (see POV-214 in the backlog).
      (function () {
        var root = document.documentElement;
        var prefersDark = true;
        try {
          prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        } catch (e) { /* keep dark */ }
        var theme = prefersDark ? 'dark' : 'light';
        var lang = (navigator.language || '').toLowerCase().indexOf('sl') === 0 ? 'sl' : 'en';
        try {
          var storedLang = localStorage.getItem('povzetkar-language');
          if (storedLang === 'sl' || storedLang === 'en') lang = storedLang;
          var stored = JSON.parse(localStorage.getItem('theme-storage') || 'null');
          var storedTheme = stored && stored.state && stored.state.theme;
          if (storedTheme === 'light' || storedTheme === 'dark') theme = storedTheme;
        } catch (e) { /* storage unavailable or corrupt — system preference / browser language */ }
        root.classList.add(theme);
        root.lang = lang;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
