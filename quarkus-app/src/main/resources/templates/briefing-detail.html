<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Briefing for {briefing.topicName} on {briefing.formattedDate}</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<p>{briefing.metaSummaryHtml}</p>

<h2>Included Summaries</h2>
<ul>
    {#for summary in briefing.summaries}
        <li>
            <h3>{summary.title}</h3>
            <p>{summary.summaryTextHtml}</p>
        </li>
    {/for}
</ul>
</body>
</html>
