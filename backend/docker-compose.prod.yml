services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: povzetkar-app:${APP_VERSION:?APP_VERSION must be set}
    container_name: povzetkar-app
    restart: always
    # Port 8080 is no longer exposed directly, only accessible via proxy.
    # 9000 = Quarkus management interface (/q/metrics, /q/health, /q/openapi): Docker network only,
    # never publish it via `ports:` or route it through Caddy / the tunnel.
    expose:
      - "8080"
      - "9000"
    environment:
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres-prod:5432/${DB_NAME:?DB_NAME must be set}
      - DB_KIND=${DB_KIND:-postgresql}
      - QUARKUS_DATASOURCE_USERNAME=${DB_USER:?DB_USER must be set}
      - QUARKUS_DATASOURCE_PASSWORD=${DB_PASS:?DB_PASS must be set}
      - QUARKUS_SWAGGER_UI_ALWAYS_INCLUDE=false
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:?YOUTUBE_API_KEY must be set}
      - GOOGLE_API_KEYS=${GOOGLE_API_KEYS:?GOOGLE_API_KEYS must be set}
      - GOOGLE_OIDC_CLIENT_ID=${GOOGLE_OIDC_CLIENT_ID:?GOOGLE_OIDC_CLIENT_ID must be set}
      - GOOGLE_OIDC_CLIENT_SECRET=${GOOGLE_OIDC_CLIENT_SECRET:?GOOGLE_OIDC_CLIENT_SECRET must be set}
      - FRONTEND_URL=${FRONTEND_URL:?FRONTEND_URL must be set}
      - TRANSCRIPT_PROXY_API_KEY=${TRANSCRIPT_PROXY_API_KEY:?TRANSCRIPT_PROXY_API_KEY must be set}
      - TRANSCRIPT_PROXY_URL=${TRANSCRIPT_PROXY_URL:-https://povzetkar-production.up.railway.app}
      - POVZETKAR_API_KEY=${POVZETKAR_API_KEY}
      - POVZETKAR_API_KEY_USER_EMAIL=${POVZETKAR_API_KEY_USER_EMAIL}
    depends_on:
      postgres-prod:
        condition: service_healthy
    networks:
      - povzetkar-net

  postgres-prod:
    image: pgvector/pgvector:pg17
    container_name: povzetkar-db-prod
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER:?DB_USER must be set}
      - POSTGRES_PASSWORD=${DB_PASS:?DB_PASS must be set}
      - POSTGRES_DB=${DB_NAME:?DB_NAME must be set}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - povzetkar-net

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: povzetkar-prometheus
    restart: always
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - povzetkar-net

  caddy:
    image: caddy:2.9.1-alpine
    container_name: povzetkar-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:?DOMAIN_NAME must be set}
      - CADDY_EMAIL=${CADDY_EMAIL:?CADDY_EMAIL must be set}
    volumes:
      - ../infra/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - povzetkar-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: povzetkar-cloudflared
    restart: always
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN must be set}
    networks:
      - povzetkar-net
    depends_on:
      - app

  grafana:
    image: grafana/grafana-oss:12.4.0
    container_name: povzetkar-grafana
    restart: always
    # Port 3000 is no longer exposed directly
    expose:
      - "3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:?GF_ADMIN_PASSWORD must be set}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_storage:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - povzetkar-net

volumes:
  postgres_prod_data:
  prometheus_data:
  grafana_storage:
  caddy_data:
  caddy_config:

networks:
  povzetkar-net:
    driver: bridge
