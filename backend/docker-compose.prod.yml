# Docker json-file logs belong to the container ID (gone on recreate) and are unbounded by
# default; every service gets the same size cap.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: povzetkar-app:${APP_VERSION:?APP_VERSION must be set}
    container_name: povzetkar-app
    restart: always
    # 8080 is not published: the Cloudflare tunnel (cloudflared) routes to app:8080 (ADR-0012).
    # 9000 = Quarkus management interface (/q/metrics, /q/health, /q/openapi). `expose` is
    # documentation only — every container on povzetkar-net (prometheus, grafana, cloudflared) can
    # reach app:9000. The boundary is: never publish it via `ports:` and never route it through a
    # Cloudflare tunnel hostname.
    expose:
      - "8080"
      - "9000"
    environment:
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres-prod:5432/${DB_NAME:?DB_NAME must be set}
      - DB_KIND=${DB_KIND:-postgresql}
      - QUARKUS_DATASOURCE_USERNAME=${DB_USER:?DB_USER must be set}
      - QUARKUS_DATASOURCE_PASSWORD=${DB_PASS:?DB_PASS must be set}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:?YOUTUBE_API_KEY must be set}
      - GOOGLE_API_KEYS=${GOOGLE_API_KEYS:?GOOGLE_API_KEYS must be set}
      - GOOGLE_OIDC_CLIENT_ID=${GOOGLE_OIDC_CLIENT_ID:?GOOGLE_OIDC_CLIENT_ID must be set}
      - GOOGLE_OIDC_CLIENT_SECRET=${GOOGLE_OIDC_CLIENT_SECRET:?GOOGLE_OIDC_CLIENT_SECRET must be set}
      - TRANSCRIPT_PROXY_API_KEY=${TRANSCRIPT_PROXY_API_KEY:?TRANSCRIPT_PROXY_API_KEY must be set}
      - TRANSCRIPT_PROXY_URL=${TRANSCRIPT_PROXY_URL:-https://povzetkar-production.up.railway.app}
      - POVZETKAR_API_KEY=${POVZETKAR_API_KEY:-}
      - POVZETKAR_API_KEY_USER_EMAIL=${POVZETKAR_API_KEY_USER_EMAIL:-}
      # File log on the app_logs volume survives container recreation; enabled only here, where
      # the volume exists (rotation settings: application.properties).
      - QUARKUS_LOG_FILE_ENABLED=true
      - QUARKUS_LOG_FILE_PATH=/var/log/app/quarkus.log
      # X-Forwarded-* only from cloudflared: must equal its ipv4_address below (POV-214).
      - QUARKUS_HTTP_PROXY_TRUSTED_PROXIES=10.203.0.10
    volumes:
      - app_logs:/var/log/app
    logging: *default-logging
    depends_on:
      postgres-prod:
        condition: service_healthy
    networks:
      - povzetkar-net

  postgres-prod:
    image: pgvector/pgvector:pg17
    container_name: povzetkar-db-prod
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER:?DB_USER must be set}
      - POSTGRES_PASSWORD=${DB_PASS:?DB_PASS must be set}
      - POSTGRES_DB=${DB_NAME:?DB_NAME must be set}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - povzetkar-net

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: povzetkar-prometheus
    restart: always
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    logging: *default-logging
    networks:
      - povzetkar-net

  # The only public entry: the tunnel routes povzetkar.<domain> to app:8080 (tunnel config in the
  # Cloudflare dashboard). TLS ends at Cloudflare; no port is published on the host (ADR-0012).
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    container_name: povzetkar-cloudflared
    restart: always
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN must be set}
    logging: *default-logging
    networks:
      povzetkar-net:
        # Fixed, so the app can trust X-Forwarded-* from exactly this peer (QUARKUS_HTTP_PROXY_TRUSTED_PROXIES).
        ipv4_address: 10.203.0.10
    depends_on:
      - app

  grafana:
    image: grafana/grafana-oss:12.4.3
    container_name: povzetkar-grafana
    restart: always
    # Local access only (http://127.0.0.1:3000; on a remote host: ssh -L 3000:localhost:3000). No public
    # hostname: a Grafana admin could add a datasource on app:9000 (RUNBOOK §13.2).
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:?GF_ADMIN_PASSWORD must be set}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_storage:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning
    logging: *default-logging
    depends_on:
      - prometheus
    networks:
      - povzetkar-net

volumes:
  postgres_prod_data:
  prometheus_data:
  grafana_storage:
  app_logs:

networks:
  povzetkar-net:
    driver: bridge
    # Fixed subnet for cloudflared's fixed address. Changing it requires recreating the network, i.e. a full
    # `down` / `up` of this stack (never `down -v`).
    # Dynamic addresses come from ip_range only, so no container can take cloudflared's .10 first.
    # 10.203.0.0/24 lies outside Docker's default address pools (172.17-31.0.0/16, 192.168.0.0/16), so
    # auto-created networks cannot collide with it.
    ipam:
      config:
        - subnet: 10.203.0.0/24
          ip_range: 10.203.0.128/25
