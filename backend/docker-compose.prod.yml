services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: povzetkar-app:0.16.0
    container_name: povzetkar-app
    restart: always
    ports:
      - "80:8080"
    environment:
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres-prod:5432/${DB_NAME}
      - QUARKUS_DATASOURCE_USERNAME=${DB_USER}
      - QUARKUS_DATASOURCE_PASSWORD=${DB_PASS}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - GOOGLE_API_KEYS=${GOOGLE_API_KEYS}
      - GOOGLE_OIDC_CLIENT_ID=${GOOGLE_OIDC_CLIENT_ID}
      - GOOGLE_OIDC_CLIENT_SECRET=${GOOGLE_OIDC_CLIENT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - METRICS_SCRAPE_TOKEN=${METRICS_SCRAPE_TOKEN}
    depends_on:
      postgres-prod:
        condition: service_healthy
    networks:
      - povzetkar-net

  postgres-prod:
    image: pgvector/pgvector:pg17
    container_name: povzetkar-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - povzetkar-net

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: povzetkar-prometheus
    restart: always
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - povzetkar-net

  grafana:
    image: grafana/grafana-oss:12.4.0
    container_name: povzetkar-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD}
    volumes:
      - grafana_storage:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - povzetkar-net

volumes:
  postgres_prod_data:
  prometheus_data:
  grafana_storage:

networks:
  povzetkar-net:
    driver: bridge
