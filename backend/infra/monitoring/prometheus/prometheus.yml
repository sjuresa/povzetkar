global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'povzetkar-backend'
    metrics_path: '/q/metrics'
    # Scrape target: Quarkus management interface on the internal Docker network.
    # No auth: port 9000 is never published or proxied, so the network is the boundary (POV-207).
    static_configs:
      - targets: ['app:9000']
