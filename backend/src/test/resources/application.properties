youtube.api.key=YOUR_TEST_YOUTUBE_API_KEY

# Transcript provider test configuration — jitter disabled
# Proxy is kept out of the default test chain so no test makes a real network call.
transcript.providers.order=youtube-legacy,supadata
transcript.providers.youtube-legacy.enabled=true
transcript.providers.youtube-legacy.jitter.min-ms=0
transcript.providers.youtube-legacy.jitter.max-ms=0
transcript.providers.supadata.enabled=false
transcript.providers.supadata.lang=en
quarkus.rest-client.supadata.url=https://api.supadata.ai
SUPADATA_API_KEY=test-key
transcript.providers.proxy.enabled=false
transcript.providers.proxy.jitter.min-ms=0
transcript.providers.proxy.jitter.max-ms=0
quarkus.rest-client.transcript-proxy.url=https://proxy.invalid
TRANSCRIPT_PROXY_API_KEY=test-key
google.api.keys=key1, key2
quarkus.oidc.client-id=test-client-id
quarkus.oidc.credentials.secret=test-secret

# Increase pool size to avoid deadlocks with REQUIRES_NEW in tests
quarkus.datasource.jdbc.max-size=20
quarkus.transaction-manager.default-transaction-timeout=PT60S
