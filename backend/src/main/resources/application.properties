# Make Flyway the owner of schema management
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.format-sql=true

# PostgreSQL Datasource Configuration
quarkus.datasource.db-kind=${DB_KIND}
quarkus.datasource.jdbc.url=jdbc:${DB_KIND}://${DB_HOST}:${DB_PORT}/${DB_NAME}
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASS}

# Flyway Configuration
# For local development, baseline the existing schema created by Hibernate.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=classpath:db/migration,classpath:com/povzetkar/quarkus/db/migration

# For the test profile (used in CI/CD), execute migrations on the empty DB.
%test.quarkus.flyway.baseline-on-migrate=false
%test.quarkus.flyway.clean-at-start=true
%test.quarkus.flyway.locations=classpath:db/migration,classpath:com/povzetkar/quarkus/db/migration

# Override datasource for tests to avoid reliance on environment variables.
# These variables will be provided via GitHub Secrets in CI/CD.
%test.quarkus.datasource.db-kind=${TEST_DB:postgresql}
%test.quarkus.datasource.jdbc.url=${TEST_JDBC_URL:jdbc:postgresql://localhost:5433/povzetkar_test}
%test.quarkus.datasource.username=${TEST_DB_USER:user}
%test.quarkus.datasource.password=${TEST_DB_PASS:password}

%test.quarkus.youtube.api.key=${YOUTUBE_API_KEY}
%test.quarkus.google.api.keys=${GOOGLE_API_KEYS}

# API Keys
youtube.api.key=${YOUTUBE_API_KEY}
google.api.keys=${GOOGLE_API_KEYS}
cooldown.period.sec=60
github.username=${GITHUB_USERNAME}
github.pat=${GITHUB_PAT}

transcript.threshold.minutes=17

# Gemini Configuration
gemini.model.name=gemini-2.5-flash
gemini.max.api.attempts=3
povzetkar.api-usage.timezone=America/Los_Angeles

# Scheduled content source enrichment cron expression (weekly on Sunday at midnight)
quarkus.scheduler.enrich-content-sources.cron=0 0 0 ? * SUN

# Scheduled orchestrator cron expression (daily at 1 AM)
povzetkar.orchestrator.cron=0 0 1 * * ?

# Scheduled briefing generation cron expression (daily at 1:05 AM)
povzetkar.briefing.cron=0 5 1 * * ?

# Orchestration lock timeout
povzetkar.orchestration.lock-timeout=PT20M

# Circuit Breaker for GenAI API calls
povzetkar.orchestrator.circuit-breaker.threshold=3

# UI Configuration
povzetkar.ui.timezone=Europe/Ljubljana
povzetkar.ui.datetime.format=dd.MM.yyyy HH:mm:ss
povzetkar.ui.date.format=dd.MM.yyyy
povzetkar.ui.admin.page-size=10
quarkus.http.host=0.0.0.0

# Container Image Configuration (Jib)
quarkus.container-image.build=false
quarkus.container-image.group=si.jumis
quarkus.container-image.name=povzetkar
#default is the latest tag - version in pom.xml
#quarkus.container-image.tag=latest
quarkus.jib.base-jvm-image=registry.access.redhat.com/ubi9/openjdk-25-runtime:1.24

# Swagger UI
quarkus.swagger-ui.always-include=false
%dev.quarkus.swagger-ui.always-include=true
%prod.quarkus.swagger-ui.always-include=false

# OpenAPI Metadata
mp.openapi.extensions.smallrye.info.title=Povzetkar API
mp.openapi.extensions.smallrye.info.version=0.11.0
mp.openapi.extensions.smallrye.info.description=REST API for Povzetkar - AI Powered Content Summarizer
quarkus.smallrye-openapi.store-schema-directory=target
quarkus.smallrye-openapi.filename=openapi
mp.openapi.scan.exclude.packages=com.povzetkar.quarkus.ui
mp.openapi.scan.exclude.paths=/ui/.*,/login,/logout,/

# Idempotency Configuration
povzetkar.idempotency.max-key-length=128
povzetkar.idempotency.max-payload-size=10485760
povzetkar.idempotency.cleanup.older-than=PT24H

# Content Filtering
povzetkar.content.video.min-duration=PT60S

# OIDC Configuration
%prod.quarkus.oidc.provider=google
%prod.quarkus.oidc.auth-server-url=https://accounts.google.com
%prod.quarkus.oidc.client-id=${GOOGLE_OIDC_CLIENT_ID}
%prod.quarkus.oidc.credentials.secret=${GOOGLE_OIDC_CLIENT_SECRET}
quarkus.oidc.application-type=web-app
quarkus.oidc.authentication.redirect-path=/api/oidc/callback
quarkus.oidc.authentication.restore-path-after-redirect=true
quarkus.oidc.authentication.scopes=openid,email,profile
quarkus.http.auth.session.timeout=PT12H

# OIDC Dev Services (Keycloak)
quarkus.oidc.provider=google
quarkus.oidc.auth-server-url=https://accounts.google.com
quarkus.oidc.client-id=${GOOGLE_OIDC_CLIENT_ID}
quarkus.oidc.credentials.secret=${GOOGLE_OIDC_CLIENT_SECRET}
%dev.quarkus.oidc.devservices.enabled=false
%test.quarkus.oidc.enabled=true

# --- Security Permissions (ORDER IS CRITICAL) ---
# 1. Public API & UI Paths
quarkus.http.auth.permission.public.paths=/,/login,/static/*,/favicon.ico,/assets/*,/api/public/*,/api/oidc/callback
quarkus.http.auth.permission.public.policy=permit

# 2. Admin Paths
quarkus.http.auth.policy.admin-role.roles-allowed=admin
quarkus.http.auth.permission.admin.paths=/ui/admin/*,/api/v1/admin/*,/api/v1/orchestrator/*
quarkus.http.auth.permission.admin.policy=admin-role

# Admin Access Control
quarkus.http.auth.permission.protected.paths=/api/*,/ui/*,/auth/login
quarkus.http.auth.permission.protected.policy=authenticated

# --- SPA INTEGRATION FIXES ---
# OIDC AJAX fix: Ensures background requests get 401 instead of a browser-blocking 302 redirect.
quarkus.oidc.authentication.java-script-auto-redirect=true
quarkus.oidc.authentication.fail-with-http-401=true
