# Make Flyway the owner of schema management
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.format-sql=true
%test.quarkus.hibernate-orm.statistics=true
%test.quarkus.hibernate-orm.log.sql=true

# PostgreSQL Datasource Configuration
quarkus.datasource.db-kind=${DB_KIND}
quarkus.datasource.jdbc.url=jdbc:${DB_KIND}://${DB_HOST}:${DB_PORT}/${DB_NAME}
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASS}

# Flyway Configuration
# For local development, baseline the existing schema created by Hibernate.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=classpath:db/migration,classpath:com/povzetkar/quarkus/db/migration

# For the test profile (used in CI/CD), execute migrations on the empty DB.
%test.quarkus.flyway.baseline-on-migrate=false
%test.quarkus.flyway.clean-at-start=true
%test.quarkus.flyway.locations=classpath:db/migration,classpath:com/povzetkar/quarkus/db/migration

# Override datasource for tests to avoid reliance on environment variables.
# These variables will be provided via GitHub Secrets in CI/CD.
%test.quarkus.datasource.db-kind=${TEST_DB:postgresql}
%test.quarkus.datasource.jdbc.url=${TEST_JDBC_URL:jdbc:postgresql://localhost:5433/povzetkar_test}
%test.quarkus.datasource.username=${TEST_DB_USER:user}
%test.quarkus.datasource.password=${TEST_DB_PASS:password}

%test.youtube.api.key=${YOUTUBE_API_KEY:test-youtube-key}
%test.google.api.keys=${GOOGLE_API_KEYS:test-google-key}
%test.quarkus.oidc.client-id=${GOOGLE_OIDC_CLIENT_ID:test-oidc-client-id}
%test.quarkus.oidc.credentials.secret=${GOOGLE_OIDC_CLIENT_SECRET:test-oidc-secret}

# API Keys
youtube.api.key=${YOUTUBE_API_KEY}
google.api.keys=${GOOGLE_API_KEYS}
cooldown.period.sec=60

transcript.threshold.minutes=3
# POV-222: after the n-th failed automatic transcript fetch a video is retried no earlier than the n-th interval
# later; the attempt after the last interval ends it as FAILED (6 intervals = 7 attempts). Manual actions are not
# counted.
transcript.retry.intervals=30m,30m,90m,90m,210m,210m

# Transcript provider configuration
transcript.providers.order=youtube-legacy,proxy,supadata
transcript.providers.youtube-legacy.enabled=true
# POV-222: automatic youtube-legacy fetches run strictly one after another app-wide. Before a fetch: a random
# pause in [fetch.min, fetch.max], measured from the end of the previous fetch (none for the first fetch or
# after idle). Inside a fetch (video page -> innertube -> captions): a random pause in [in-fetch.min,
# in-fetch.max] before each call but the first. The manual "Fetch transcript" is not paced.
transcript.providers.youtube-legacy.pacing.fetch.min=15s
transcript.providers.youtube-legacy.pacing.fetch.max=45s
transcript.providers.youtube-legacy.pacing.in-fetch.min=1s
transcript.providers.youtube-legacy.pacing.in-fetch.max=5s
transcript.providers.supadata.enabled=false
transcript.providers.supadata.lang=en
quarkus.rest-client.supadata.url=https://api.supadata.ai
transcript.providers.proxy.enabled=true
transcript.providers.proxy.jitter.min-ms=15000
transcript.providers.proxy.jitter.max-ms=45000
transcript.providers.proxy.api-key=${TRANSCRIPT_PROXY_API_KEY:dummy_api_key}
quarkus.rest-client.transcript-proxy.url=${TRANSCRIPT_PROXY_URL:https://povzetkar-production.up.railway.app}

# Gemini Configuration
gemini.model.name=gemini-2.5-flash
gemini.max.api.attempts=3
povzetkar.api-usage.timezone=America/Los_Angeles

# Scheduled content source enrichment cron expression (weekly on Monday at 10:00 UTC)
povzetkar.enrichment.cron=0 0 10 ? * MON

# Scheduled audit log retention cron expression (daily at 10:00 UTC)
povzetkar.retention.cron=0 0 10 * * ?

# Scheduled orchestrator cron expression (every hour at :27 past the hour)
# Each run: fetch+summarize for today and yesterday, then generate briefing for yesterday (idempotent)
povzetkar.orchestrator.cron=0 27 * * * ?
# POV-213: no scheduled job fires on its own in tests; a test that needs one resumes it (docs/guides/testing.md).
# The orchestration fires every second while resumed.
%test.quarkus.scheduler.start-mode=halted
%test.povzetkar.orchestrator.cron=* * * * * ?

# Orchestration lock timeout
# POV-222: above the longest expected run (time budget 15m + items in progress) and max-worker-execute-time, so a
# running date is never taken over as "crashed" by a second run.
povzetkar.orchestration.lock-timeout=PT30M
# POV-222: time budget of one orchestration run (scheduled, manual, per topic). Once used up, items not yet
# started (or still waiting for a YouTube transcript slot) are left unchanged for the next run.
povzetkar.orchestration.time-budget=15m

# Vert.x worker thread max execution time (default 60s is too short for orchestration runs).
# POV-222: above the run time budget (15m) plus the items still in progress and the briefing step — a paced run
# regularly takes 15 min, and the blocked-thread checker would warn on every check after this limit.
quarkus.vertx.max-worker-execute-time=1200s

# Circuit Breaker for GenAI API calls
povzetkar.orchestrator.circuit-breaker.threshold=3

# UI Configuration
povzetkar.ui.timezone=Europe/Ljubljana
povzetkar.ui.datetime.format=dd.MM.yyyy HH:mm:ss
povzetkar.ui.date.format=dd.MM.yyyy
povzetkar.ui.admin.page-size=10
quarkus.http.host=0.0.0.0

# Swagger UI
quarkus.swagger-ui.always-include=false
%dev.quarkus.swagger-ui.always-include=true
%prod.quarkus.swagger-ui.always-include=false

# --- SECRETS MANAGEMENT ---
# Suppress config value logging at startup to prevent secret leakage. Secrets come only from
# the environment and are never logged. (Quarkus has no `quarkus.config.secret-keys` property;
# SmallRye secret keys are a programmatic access lock, not masking — POV-208.)
quarkus.config.log.values=false

# --- PROGRAMMATIC API-KEY ACCESS (POV-205) ---
# Optional read-only API key for automation agents. Both values must be set for the
# mechanism to authenticate anyone; leave both unset (blank) to disable programmatic
# access. Provide them via the environment (e.g. backend/.env, .env.docker):
#   POVZETKAR_API_KEY=<secret, e.g. openssl rand -hex 32>
#   POVZETKAR_API_KEY_USER_EMAIL=<email of the existing ENABLED user the key acts as>
povzetkar.api.key=${POVZETKAR_API_KEY:}
povzetkar.api.key-user-email=${POVZETKAR_API_KEY_USER_EMAIL:}
%test.povzetkar.api.key=test-api-key-2c4c07700e1f4b3f
%test.povzetkar.api.key-user-email=apikey@test.local

# OpenAPI Metadata
mp.openapi.extensions.smallrye.info.title=Povzetkar API
mp.openapi.extensions.smallrye.info.version=0.13.0
mp.openapi.extensions.smallrye.info.description=REST API for Povzetkar - AI Powered Content Summarizer
quarkus.smallrye-openapi.store-schema-directory=target
mp.openapi.scan.exclude.packages=com.povzetkar.quarkus.ui
mp.openapi.scan.exclude.paths=/ui/.*,/login,/logout,/

# Idempotency Configuration
povzetkar.idempotency.max-key-length=128
povzetkar.idempotency.max-payload-size=10485760
povzetkar.idempotency.cleanup.older-than=PT24H

# Content Filtering
povzetkar.content.video.min-duration=PT150S

# OIDC Configuration
%prod.quarkus.oidc.provider=google
%prod.quarkus.oidc.auth-server-url=https://accounts.google.com
%prod.quarkus.oidc.client-id=${GOOGLE_OIDC_CLIENT_ID}
%prod.quarkus.oidc.credentials.secret=${GOOGLE_OIDC_CLIENT_SECRET}
quarkus.oidc.application-type=web-app
quarkus.oidc.authentication.redirect-path=/api/oidc/callback
quarkus.oidc.authentication.restore-path-after-redirect=true
quarkus.oidc.authentication.scopes=openid,email,profile
# Session: the OIDC session cookie is q_session (Quarkus default name, path /, SameSite=Lax).
# Its lifetime is the ID token's (Google: 1 h) plus session-age-extension (default 5 min);
# token.refresh-expired is off, so an expired session re-authenticates via Google.

# OIDC Dev Services (Keycloak)
quarkus.oidc.provider=google
quarkus.oidc.auth-server-url=https://accounts.google.com
quarkus.oidc.client-id=${GOOGLE_OIDC_CLIENT_ID}
quarkus.oidc.credentials.secret=${GOOGLE_OIDC_CLIENT_SECRET}
%dev.quarkus.oidc.devservices.enabled=false
%test.quarkus.oidc.enabled=true

# --- Security Permissions (ORDER IS CRITICAL) ---
# 1. Public API & UI Paths
quarkus.http.auth.permission.public.paths=/,/login,/static/*,/favicon.ico,/assets/*,/api/public/*,/api/v1/public/*,/api/oidc/callback,/api/v1/system/*
quarkus.http.auth.permission.public.policy=permit

# 2. Admin Paths
# /ui/* is the legacy server-rendered UI; the SPA does not use it. Admin-only since POV-219: its pages are not
# scoped to the user's topics (they list every source and show any summary by ID).
quarkus.http.auth.policy.admin-role.roles-allowed=admin
quarkus.http.auth.permission.admin.paths=/ui/*,/api/v1/admin/*,/api/v1/orchestrator/*
quarkus.http.auth.permission.admin.policy=admin-role

# Admin Access Control
quarkus.http.auth.permission.protected.paths=/api/*,/ui/*,/auth/login
quarkus.http.auth.permission.protected.policy=authenticated

# --- HTTP SECURITY HEADERS & CACHING (POV-214, ADR-0012) ---
# The Cloudflare tunnel routes straight to app:8080; no reverse proxy adds headers, the app sends them.
# Header and filter handlers run first (route order Integer.MIN_VALUE), so auth redirects and 401s carry
# them too. Overlapping quarkus.http.filter entries MERGE their values into one multi-valued header, so
# each pair below uses mutually exclusive path regexes. Guarded by SecurityHeadersTest,
# CachingHeadersTest, CspInlineScriptHashTest and the Playwright project "csp".
quarkus.http.header."Strict-Transport-Security".value=max-age=31536000; includeSubDomains
quarkus.http.header."X-Frame-Options".value=DENY
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."Referrer-Policy".value=strict-origin-when-cross-origin
quarkus.http.header."Permissions-Policy".value=camera=(), microphone=(), geolocation=()
# Legacy server-rendered UI (/ui/*, /login, /logout): inline handlers/scripts/styles and CDN CSS and
# fonts. Weaker by necessity until the legacy UI is removed.
quarkus.http.filter.csp-legacy.matches=/(ui|login|logout)(/.*)?
quarkus.http.filter.csp-legacy.header."Content-Security-Policy"=default-src 'self'; \
  script-src 'self' 'unsafe-inline'; \
  style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; \
  font-src 'self' https://cdnjs.cloudflare.com; img-src 'self' https: data:; connect-src 'self'; \
  object-src 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com; frame-ancestors 'none'
# Everything else - the SPA, its assets, the API, and /q (its 404s on the public port included). Only in dev
# mode /q is excluded: the management interface is off there and Swagger UI (inline scripts) runs on /q.
# script-src: the sha256 of the inline pre-paint script in frontend/index.html - recompute on every change
# of that script. style-src 'unsafe-inline': sonner injects a <style> element at runtime.
quarkus.http.filter.csp-strict.matches=(?!/(ui|login|logout)(/|$)).*
%dev.quarkus.http.filter.csp-strict.matches=(?!/(ui|login|logout|q)(/|$)).*
quarkus.http.filter.csp-strict.header."Content-Security-Policy"=default-src 'self'; \
  script-src 'self' 'sha256-wUsJnW5D/ibAz6zZ7Y+Z4vZSo+E4+9jVKupcVxStHiE='; \
  style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self'; connect-src 'self'; \
  object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'
# Caching: Vert.x's StaticHandler writes "public, immutable, max-age=<static-resources.max-age>" - only when
# it serves a file, and only if no Cache-Control is set yet. The 24 h default kept a stale SPA shell for a
# day after a deploy. Only Vite's content-hashed /assets/* may be immutable: they keep the handler's header
# (one year), so a 404 for a hashed URL is never cached. Everything else static (SPA shell, locales, public
# files, legacy /static) gets no-cache from the filter first and is revalidated (Last-Modified -> 304).
# /api and the legacy pages keep their own headers.
quarkus.http.static-resources.max-age=365D
quarkus.http.filter.cache-revalidate.matches=(?!/(api|ui|login|logout|auth|q|assets)(/|$)).*
quarkus.http.filter.cache-revalidate.methods=GET,HEAD
quarkus.http.filter.cache-revalidate.header."Cache-Control"=no-cache

# --- PROXY & NETWORK CONFIG ---
# Honor X-Forwarded-* headers only from a trusted peer (POV-214, ADR-0012): in production cloudflared (the
# tunnel routes straight to app:8080), in dev the Vite proxy. The default trusts loopback only (Vite
# connects from 127.0.0.1 or ::1); docker-compose.prod.yml sets QUARKUS_HTTP_PROXY_TRUSTED_PROXIES to
# cloudflared's fixed address. From any other peer the headers are ignored, so they cannot skew the OIDC
# redirect URI, the Secure-cookie decision or client addresses. Guarded by TrustedProxyTest.
# Through the tunnel the request's remote address is the FIRST X-Forwarded-For element, which the client
# can set (Cloudflare keeps a client-sent value and appends the real one). Never base an IP decision
# (rate limit, allow list) on it - the trustworthy client IP is the CF-Connecting-IP header.
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-x-forwarded=true
quarkus.http.proxy.enable-forwarded-host=true
quarkus.http.proxy.trusted-proxies=127.0.0.1,[::1]

# OIDC Specific Cookie Settings (Required for multi-host dev over HTTP)
%dev.quarkus.oidc.authentication.cookie-force-secure=false
quarkus.oidc.authentication.cookie-same-site=Lax

# --- SPA INTEGRATION ---
# Unauthenticated XHR (POV-221): with java-script-auto-redirect=false OIDC answers a request that
# XhrAuthenticationChallenge recognises as JavaScript (X-Requested-With: XMLHttpRequest, sent by the
# Axios client, or JavaScript) with 401 + WWW-Authenticate: OIDC, independent of Origin; the SPA's 401
# interceptor handles the expired session. Browser navigations keep the 302 to the Google login.
quarkus.oidc.authentication.java-script-auto-redirect=false

# SPA fallback (POV-221): SpaRoutingHandler (ui/util) serves index.html only for the exact routes of
# frontend/src/router.tsx (SPA_ROUTES, kept equal to the router by SpaRouteAllowListTest); any other path that
# reaches it answers a bare 404.

# OIDC Post-Login and Post-Logout redirects (defaults to React SPA)
povzetkar.auth.post-login-uri=/dashboard
povzetkar.auth.post-logout-uri=/

# No CORS (POV-221, ADR-0012): every browser client is same-origin - production behind the tunnel, dev
# through the Vite proxy - so login/logout redirects are relative and no origin is granted cross-origin
# access. A frontend on a separate origin would need CORS (and absolute redirects) again.

# --- MONITORING & METRICS ---
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true
# JVM metrics are on by default (quarkus.micrometer.binder-enabled-default=true).
# Custom metrics are prefixed with 'povzetkar_' in the code.
# Bounded uri tag on http.server.* (POV-221): Micrometer stops recording past 100 distinct uri values
# (POV-210), and a request without a JAX-RS template is tagged with its literal, raw path. HttpMetricsConfig
# keeps only canonical values under /api and /ui (endpoint templates, legacy UI routes), Quarkus' special values
# and /login, /logout, /auth/login; SPA routes become SPA, files STATIC, any other path UNKNOWN (incl. raw
# variants such as /%73ources/1 or /api/%2e%2e/sources/1; /q is not metered). Untemplated 4xx
# become UNKNOWN here - e.g. the OIDC 401 for an unauthenticated request to a path under /api or /ui that
# matches no endpoint, which a scanner chooses freely. 404 is NOT_FOUND, 3xx REDIRECTION.
quarkus.micrometer.binder.http-server.suppress4xx-errors=true

# --- MANAGEMENT INTERFACE ---
# Serves the technical endpoints (/q/metrics, /q/health, /q/openapi) on a separate port (9000,
# 9001 in tests) instead of the public HTTP port. The Cloudflare tunnel only forwards 8080, so the
# unpublished management port is the protection boundary: reachable from the
# Docker network (Prometheus, HEALTHCHECK) only. Build-time property; tests run with it enabled
# so they exercise the production topology.
quarkus.management.enabled=true
# Dev mode keeps everything on 8080: Swagger UI "Try it out" must call /api on its own origin
# (a page on 9000 would hit 9000/api → 404, and 8080 grants no CORS).
%dev.quarkus.management.enabled=false

# --- LOGGING ---
# The file handler is switched on only by the prod container (docker-compose.prod.yml), which
# mounts the log volume. Size rotation only: 11 x 10M.
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=10
# Default true would rotate on every boot; the host restarts daily.
quarkus.log.file.rotation.rotate-on-boot=false

# HTTP access log - the forensic record (Cloudflare keeps no request logs on this plan). The tunnel routes
# straight to app:8080, so the app sees every request.
# consolidate + %<r: SpaRoutingHandler reroutes unknown paths to /index.html; without these every
# probe would be logged (twice) as GET /index.html. cf-ip (CF-Connecting-IP) is the client address.
# Only values set by Cloudflare (cf-ip, country, ray - CF-Ray links a line to Cloudflare's security
# events) or by the server (user: set by AccessLogPrincipalRoute - Google subject for OIDC, mapped e-mail for
# API keys, safe characters only; not %u, which is the user-controlled Google display name)
# precede the request line. Client-controlled values (Host, Referer, X-Forwarded-For) come after the
# status, and there is no %h (the client's own first X-Forwarded-For value could forge a line prefix).
# The request line keeps the query string (attack payloads). Never add X-API-Key.
%prod.quarkus.http.access-log.enabled=true
quarkus.http.access-log.consolidate-rerouted-requests=true
quarkus.http.record-request-start-time=true
quarkus.http.access-log.pattern=%t cf-ip=%{i,CF-Connecting-IP} country=%{i,CF-IPCountry} ray=%{i,CF-Ray} user=%{d,povzetkar.log-user} "%<r" %s %b %D host="%{i,Host}" ref="%{i,Referer}" xff="%{i,X-Forwarded-For}" "%{i,User-Agent}"
# Own file with size rotation, 20 x 10M (years at today's volume; a bot wave cannot evict the history
# quickly), and out of quarkus.log/docker logs. The handler and the category routing are switched on
# together in %prod: routing to a disabled handler would drop the lines. /var/log/app exists in the image
# (Dockerfile) and is the app_logs volume in docker-compose.prod.yml. (quarkus.http.access-log.log-to-file
# is not used: it rotates daily without a backup limit.)
%prod.quarkus.log.handler.file."access".enabled=true
%prod.quarkus.log.handler.file."access".path=/var/log/app/access.log
%prod.quarkus.log.handler.file."access".format=%s%n
%prod.quarkus.log.handler.file."access".rotation.max-file-size=10M
%prod.quarkus.log.handler.file."access".rotation.max-backup-index=19
%prod.quarkus.log.handler.file."access".rotation.rotate-on-boot=false
%prod.quarkus.log.category."io.quarkus.http.access-log".handlers=access
%prod.quarkus.log.category."io.quarkus.http.access-log".use-parent-handlers=false
