{#include main.html}
{#title}Add Content Source{/title}
{#content}
    <h1>Add Content Source</h1>

    <form action="/ui/content-sources" method="post">
        <input type="hidden" name="topicId" value="{topicId}">
        <fieldset>
            <legend>Content Source Details</legend>
            <div>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" value="{name ?: ''}" required placeholder="e.g., My Content Source">
            </div>
            <div>
                <label for="sourceIdentifier">Source Identifier:</label>
                <input type="text" id="sourceIdentifier" name="sourceIdentifier" value="{sourceIdentifier ?: ''}" required placeholder="e.g., unique-source-id">
            </div>
            <div>
                <label for="sourceTypeId">Source Type:</label>
                <select id="sourceTypeId" name="sourceTypeId" required>
                    {#for sourceType in sourceTypes}
                        <option value="{sourceType.id}" {#if sourceTypeId && sourceTypeId == sourceType.id}selected{/if}>{sourceType.name}</option>
                    {/for}
                </select>
            </div>
        </fieldset>
        <div>
            <button type="submit">Add Content Source</button>
        </div>
    </form>
{/content}
