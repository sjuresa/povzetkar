{#include main.html}
{#title}Select Content Source{/title}
{#content}
    <h1>Select Content Source for {topic.name}</h1>

    <form action="/ui/topics/{topic.id}/select-source" method="get">
        <label for="searchQuery">Search:</label>
        <input type="text" id="searchQuery" name="query" placeholder="Search content sources..." value="{query ?: ''}">
        <button type="submit">Search</button>
    </form>
    <div>
    {#if contentSources}
        <h2>Available Content Sources</h2>
        <ul>
            {#for source in contentSources}
                <li>
                    {source.name}
                    <form action="/ui/topics/{topic.id}/add-source/{source.id}" method="post" class="form-inline">
                        <a href="#" class="icon-link icon-add" title="Add Content Source" onclick="this.closest('form').submit(); return false;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-plus-circle" viewBox="0 0 16 16">
                                <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
                                <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"/>
                            </svg>
                        </a>
                    </form>
                </li>
            {/for}
        </ul>
    {#else}
        <p>No content sources found.</p>
    {/if}
    </div>
{/content}
