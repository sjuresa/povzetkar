{#include main.html}
{#title}Topics{/title}
{#content}
<h1>Topics by User</h1>
{#for entry in topicsByUser.entrySet()}
<h2>{entry.key.name}</h2>
<ul>
    {#for topic in entry.value}
    <li>
        <a href="/ui/topics/{topic.id}/briefings">{topic.name}</a>
        <a href="/ui/topics/{topic.id}/edit" class="icon-link icon-add" data-tooltip="Edit Topic"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                 viewBox="0 0 16 16">
                <path d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293zm-9.761 5.175-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 0 1 5 12.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.474-.223z"/>
            </svg></a>
        <form action="/ui/topics/delete/{topic.id}" method="post" class="form-inline">
            <a href="#" class="icon-link icon-delete confirm-submit" data-tooltip="Delete Topic" data-confirm-message="Are you sure you want to delete this topic?">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
                    <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0z"/>
                    <path d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H9.5a1 1 0 0 1 1 1v.5h4a1 1 0 0 1 1 1zM2.5 3a.5.5 0 0 0 0 1H3v9a1 1 0 0 0 1 1h7a1 1 0 0 0 1-1V4h.5a.5.5 0 0 0 0-1zm3-2h4V.5a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5.5zm7 0h-1.5V.5a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5.5V1H2.5a.5.5 0 0 0 0 1H13a.5.5 0 0 0 0-1z"/>
                </svg>
            </a>
        </form>
    </li>
    {/for}
</ul>
{/for}
<p></p>
<button onclick="window.location.href='/ui/topics/add'">Add New Topic</button>

{/content}
