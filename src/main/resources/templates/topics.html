{#include 'main.html'}
{#title}Topics{/title}
{#content}
    <h1>Topics by User</h1>
    <form action="/ui/topics/add" method="get" style="display: inline;">
        <button type="submit">Add New Topic</button>
    </form>

    {#for entry in topicsByUser.entrySet()}
        <h2>{entry.key.name}</h2>
        <ul>
            {#for topic in entry.value}
                <li>
                    <a href="/ui/topics/{topic.id}/briefings">{topic.name}</a>
                    <a href="/ui/topics/{topic.id}/edit">[Edit]</a>
                    <form action="/ui/topics/delete/{topic.id}" method="post" style="display: inline;">
                        <button type="submit" class="secondary outline">[Delete]</button>
                    </form>
                </li>
            {/for}
        </ul>
    {/for}
{/content}
